[pytest]
# Two suites live in this tree and they are run SEPARATELY, matching
# Sibling-C's dual-suite convention:
#
#   python -m pytest tests                  the application suite
#   python -m pytest agents/pity_engine     the engine's own suite
#
# Never `pytest .` from the root. The engine package is self-validating and is
# mirrored as a standalone unit; collecting it under a root-wide run is how
# Sibling-C earned its own "import file mismatch" incident.
norecursedirs = .* build dist venv node_modules __pycache__ data logs ops/runtime

# Deterministic output. The engine is a pure function of its inputs, so a
# flaky-looking result is a real defect and must not be hidden by ordering.
addopts = -q --strict-markers --strict-config

# Shared host: a sibling measured 68,630 leftover temp files from about 9
# pytest runs, stalling logon by roughly 155 s. Only keep tmp_path dirs for
# failed tests.
tmp_path_retention_policy = failed

# Measured on this host 2026-09-20, and recorded here because the obvious
# follow-up edits are no-ops and the next reader will otherwise make one.
#
# `tmp_path_retention_policy` is a RETENTION control. It decides whether a
# PASSED test's own tmp_path directory is kept. It cannot move where files
# land, and it cannot bound how many numbered pytest-N ROOT directories pile
# up under %TEMP%/pytest-of-<user>. That root is keyed to the USER and not to
# the repo, so every repository on this host shares one.
#
# Do NOT add `tmp_path_retention_count = 3`. pytest's own default for that
# key is already the string "3" (_pytest/tmpdir.py, pytest_addoption), so the
# line restates a default and moves nothing. Root pruning here is not failing
# on the count: of 14 numbered roots present, 12 were already cleanup
# candidates under keep=3 and every single one was refused by
# _pytest.pathlib.ensure_deletable because it still carried a `.lock` younger
# than LOCK_TIMEOUT - 259200 s, that is 72 hours, a module constant that no
# ini key reaches. A control in a private root reproduced exactly that split:
# of seven candidates, only the four without a fresh lock were removed. Those
# stale locks are left behind by pytest processes that were KILLED; a process
# that exits cleanly unlinks its own lock.
#
# Do NOT point PYTEST_DEBUG_TEMPROOT inside the repo either. Measured the same
# day: a deeper temp root turned 3114 passed / 0 failed into 5 failed and 6
# errors, every one of them `git add` reporting "Filename too long" from the
# end-to-end hook-gate fixtures. The temp root's depth is load-bearing here.
#
# One full `python -m pytest tests` in this tree left 163 files across two
# numbered directories. This repository is not the source of the pile.

markers =
    slow: marks a test as slow (deselect with '-m "not slow"')
    network: marks a test that would touch a live external API (deselected in CI)
