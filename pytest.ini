[pytest]
# Two suites live in this tree and they are run SEPARATELY, matching
# Sibling-C's dual-suite convention:
#
#   python -m pytest tests                  the application suite
#   python -m pytest agents/pity_engine     the engine's own suite
#
# Never `pytest .` from the root. The engine package is self-validating and is
# mirrored as a standalone unit; collecting it under a root-wide run is how
# Sibling-C earned its own "import file mismatch" incident.
norecursedirs = .* build dist venv node_modules __pycache__ data logs ops/runtime

# Deterministic output. The engine is a pure function of its inputs, so a
# flaky-looking result is a real defect and must not be hidden by ordering.
addopts = -q --strict-markers --strict-config

# A parametrize list that has gone empty - a git ls-files corpus that matched
# nothing, a mutant table a refactor emptied - must be a collection ERROR. The
# pytest default is `skip`, which collects one SKIPPED item and leaves the run
# green while the guard tests nothing. Guarded by
# tests/test_empty_parametrize_policy.py, with a control arm.
empty_parameter_set_mark = fail_at_collect

# Shared host: a sibling measured 68,630 leftover temp files from about 9
# pytest runs, stalling logon by roughly 155 s. Only keep tmp_path dirs for
# failed tests.
tmp_path_retention_policy = failed

# MAIN FIX TEMP-1 (2026-10-09, SHA-256 verified, operator authority): keep at
# most ONE numbered basetemp root. MAIN measured this tree's long-lived
# session scratchpads at 20.2k, 16.1k and 13.3k entries; one held 16 basetemp
# dirs and 22,876 entries. Decision: adopt 1. Alternative rejected: leave
# pytest's own default "3". Reversed by: a MAIN ruling. Pinned by
# tests/test_pytest_temp_hygiene.py and tests/test_pytest_ini_temp_policy.py.
#
# This key does NOT reach `_pytest.pathlib.LOCK_TIMEOUT` (72 h): a numbered
# root still holding a fresh `.lock` left by a KILLED pytest survives pruning
# regardless (measured 2026-09-20). The other half of TEMP-1 is behavioural
# and lives in CLAUDE.md's Testing section: never pass --basetemp inside a
# session scratchpad; reuse ONE fixed basetemp, or remove it right after
# reading the result with a read-only-safe rmtree.
#
# Do NOT point PYTEST_DEBUG_TEMPROOT inside the repo. Measured 2026-09-20: a
# deeper temp root turned 3114 passed / 0 failed into 5 failed and 6 errors,
# every one `git add` reporting "Filename too long" from the end-to-end
# hook-gate fixtures. The temp root's depth is load-bearing here.
tmp_path_retention_count = 1

markers =
    slow: marks a test as slow (deselect with '-m "not slow"'; .githooks/pre-push deselects it)
    network: marks a test that would touch a live external API (deselected in CI)
    plumbing: applied centrally from tests/_markers.py - the subject is fleet, responder, hook, CI or runner plumbing
    reads_docs: applied centrally from tests/_markers.py - the module reads tracked .md content
