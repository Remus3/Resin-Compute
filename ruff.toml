# ruff.toml - ResinCompute
#
# Ported from Sibling-C's ruff.toml. Two deliberate divergences from the
# parent, both recorded in docs/SPEC_SCAFFOLD.md section 1:
#
#   1. target-version is py311, not py39. That sibling targets py39 because it has a
#      deployed py39 surface. This is a new tree with none, so the UP007 /
#      UP035 / UP045 / UP006 suppressions it needs for py39 compatibility are
#      NOT inherited - modern union and builtin-generic syntax is allowed and
#      pyupgrade is left free to enforce it.
#
#   2. F401 and F841 are NOT globally ignored. Sibling-C suppresses both as "too
#      noisy" against an existing large tree. A greenfield tree has no such
#      debt, and both catch real defects, so they stay on. The one place F401
#      is genuinely expected is __init__.py re-exports, which is scoped below.
#
# Everything else is Sibling-C's config as-is, including the BLE ratchet.

target-version = "py311"
line-length = 120

# ops/fleet_kit/ holds MAIN's FLEET-KIT bytes, vendored and sha256-pinned by
# its own MANIFEST.json and conformance(). It is NOT excluded. Kit v3 was
# (6 findings: UP031 x4, B904, UP004) and a local lint fix would have broken
# the pin. Kit v4 was MEASURED clean under this config on 2026-10-03 with
# `ruff check --no-force-exclude ops/fleet_kit/fleet_headless.py`, so the
# exclusion was dropped. If a later kit version is not clean, do not patch
# the bytes: per-file-ignore only the failing rule on only the failing kit
# file (see [lint.per-file-ignores]) and report to MAIN.

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (safe modern syntax)
    "B",    # flake8-bugbear (common bugs)
    "BLE",  # flake8-blind-except - ratchet: no NEW bare `except Exception`
]
ignore = [
    "E501",   # line too long - not enforced, formatter's job
    "E741",   # ambiguous variable names - common in short math loops
    "B008",   # function calls in default args - used intentionally
    "B905",   # zip() without strict= - noisy on fixed-length pairs
]

exclude = [
    "__pycache__",
    ".venv",
    "ops/runtime",
    "data",
    "logs",
]

[lint.per-file-ignores]
# One-off maintenance scripts are procedural; bugbear and import order are
# both too strict for them, matching Sibling-C's own carve-out.
"scripts/*.py" = ["B", "I"]
# __init__.py re-exports are the point of the file.
"*/__init__.py" = ["F401"]
# The engine package is a fail-soft local compute service. A blind except at a
# request boundary is the correct behaviour there - a malformed query must
# degrade to a 400, never take the daemon down. Scoped to the engine only, so
# the ratchet still bites everywhere else.
"agents/pity_engine/__main__.py" = ["BLE001"]
"headless/runner.py" = ["BLE001"]
"ops/supervisor.py" = ["BLE001"]
# Tests assert on constants that read as magic numbers by design.
"tests/*.py" = ["B011"]
# Kit v10 (MAIN 0839 ORDER of 2026-10-08) ships fleet_inbox.py and
# fleet_done.py UP031 clean, so UP031 is no longer ignored anywhere. Measured
# 2026-10-08 under this config with no kit per-file ignores, the v10 kit still
# fails: fleet_inbox.py UP017 x1; fleet_done.py UP017 x1 and UP032 x3 (new in
# v10, `str.format` replacing the old printf formats); fleet_subagent_first.py
# BLE001 x1 (its deliberate never-fail-closed `except Exception`). Kit bytes are
# never patched; only the failing rules on only the failing kit files are
# ignored instead of excluding the whole kit dir, and the defect is reported to
# MAIN. Remove an entry when a kit version ships that file clean.
"ops/fleet_kit/fleet_inbox.py" = ["UP017"]
"ops/fleet_kit/fleet_done.py" = ["UP017", "UP032"]
"ops/fleet_kit/fleet_subagent_first.py" = ["BLE001"]
# Kit v12 (MAIN 2031 ORDER of 2026-10-08), measured 2026-10-08 under this
# config: fleet_claims.py UP032 x1 and BLE001 x1 (its never-fail-closed hook
# `except Exception`); fleet_gitlock.py UP032 x3; fleet_suite_gate.py UP032 x2.
"ops/fleet_kit/fleet_claims.py" = ["UP032", "BLE001"]
"ops/fleet_kit/fleet_gitlock.py" = ["UP032"]
"ops/fleet_kit/fleet_suite_gate.py" = ["UP032"]
# Kit v13 (MAIN bundle 2128 of 2026-10-08), measured 2026-10-08: the v12
# entries above still hold (fleet_gitlock.py now UP032 x4); new files
# fleet_identity.py UP032 x4 and fleet_rewrite.py UP032 x4.
"ops/fleet_kit/fleet_identity.py" = ["UP032"]
"ops/fleet_kit/fleet_rewrite.py" = ["UP032"]
"agents/pity_engine/tests/*.py" = ["B011"]

[lint.isort]
known-first-party = [
    "core", "engines", "ingest", "headless", "ops", "agents",
]
