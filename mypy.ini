[mypy]
# Ported from Riot Commander's mypy.ini, tightened.
#
# RC runs `follow_imports = skip` and `check_untyped_defs = True` over `core/`
# only, because it is retrofitting types onto a large existing tree. This tree
# is greenfield, so imports ARE followed and the typed surface is wider.
#
# disallow_untyped_defs stays False for now: it would fail the scaffold's test
# modules, which are deliberately terse. Tighten it once the suites settle.
#
# EXCLUDE, and the reason it is narrow rather than an ignore rule. `files=`
# below names `agents/pity_engine/`, which crawls the engine's OWN tests/
# subdirectory. Those modules import pytest, mypy follows _pytest.python_api
# into numpy, and numpy's shipped __init__.pyi uses a PEP 695 `type` statement
# that is a syntax error under the pinned python_version = 3.11. One error, in a
# third-party stub, that prevented all further checking.
#
# Measured 2026-09-06: core/, engines/ and ingest/ each check clean on their
# own, so agents/pity_engine/tests/ was the sole path to numpy. numpy is NOT a
# stray - ImageHash, opencv-python, PyWavelets and scipy all require it on this
# box - so uninstalling it was rejected as breaking software outside this repo.
# Silencing numpy in mypy would mask the cause; the cause is that a test
# directory was being type-checked at all. `[mypy-tests.*]` below already
# records the intent that test modules are not the typed surface - that pattern
# simply never matched `agents.pity_engine.tests.*`.
exclude = ^agents/pity_engine/tests/
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = False
disallow_incomplete_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
# FILES, and why this list is a PROPER SUBSET of the tracked tree.
#
# The comment above explains `exclude=` and nothing else. `files=` was the line
# that actually decided coverage and it carried no rationale at all, so
# `python -m mypy` printed `Success: no issues found in 23 source files` over 92
# tracked `.py` while two files in `.claude/agents/` instructed agents to treat
# that as a done-gate for any slice. A builder working outside these roots ran
# it, read Success, and reported done on a module mypy had never opened.
#
# Measured 2026-09-07 by adding each remaining directory on its own against an
# unmodified tree. `tools/` came in at zero cost and is now in, which matters
# because it holds the guards. What each of the rest would cost:
#
#   tools/     0 errors  ADDED
#   surface/   1 error
#   headless/  3 errors
#   ops/       8 errors
#   scripts/   BLOCKED - "Source file found twice under different module names"
#              on scripts/make_shortcut.py; needs an __init__.py or
#              --explicit-package-bases before the directory can be added
#   tests/     untyped by convention here
#
# `tests/test_mypy_scope.py` pins this. It holds the dark set as a literal with
# a reason per entry, asserts every root below is still present, and compares
# mypy's own reported file count against the roots' arithmetic - so a root
# quietly leaving this line goes RED rather than going quiet.
files = core/, engines/, ingest/, agents/pity_engine/, tools/

# DEAD SECTION, kept as a marker rather than deleted.
#
# `tests/` is not in `files=`, so this can never fire; `warn_unused_configs` is
# off, so mypy never says so. It records the intent for the day `tests/` comes
# in. Do not cite it as an active setting.
[mypy-tests.*]
check_untyped_defs = False
