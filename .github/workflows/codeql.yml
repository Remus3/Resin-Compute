# CodeQL static analysis, advanced setup (MAIN ORDER 0300, 2026-10-05).
#
# Three languages, each the one actually present: python (the whole runtime),
# javascript-typescript (the Electron companion under shell/) and actions (the
# workflow files themselves). build-mode none for all three - none of them
# compiles, and CodeQL extracts Python and JS/TS straight from source.
#
# UPLOAD IS NOT GUARDED. The repository is PUBLIC (checked with
# `gh repo view --json visibility` on 2026-10-08), and code scanning upload is
# available to every public repository without GitHub Advanced Security. A
# sibling tree had to gate its upload because its repository is private; that
# reason does not apply here. If this repository ever goes private without
# code scanning, the analyze step will red and needs `upload: never` plus a
# SARIF artifact instead - do not paper over it with continue-on-error.
#
# Action pins: full commit SHAs, tag in the trailing comment, kept current by
# the github-actions entry in .github/dependabot.yml. tests/test_supply_chain.py
# reds on a tag-pinned or comment-less `uses:`.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:17 UTC - off the hour so it does not queue behind
    # every other scheduled workflow on the shared runners.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Read-only at the top. The single escalation, security-events: write, is at
# JOB level below and only on the job that uploads results.
permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
