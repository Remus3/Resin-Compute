# The complement of ci.yml's docs path-split.
#
# WHY THIS PAIRING EXISTS
# -----------------------
# ci.yml carries `paths-ignore: ['**/*.md']`, so a docs-only commit triggers NO
# workflow at all. That is a deliberate minute saver and it is worth keeping.
# On its own, though, it leaves two holes:
#
#   1. Test modules that READ tracked .md off disk and assert on its CONTENT
#      can be turned RED by a prose edit. With no workflow firing, nothing is
#      watching. Sibling-C hit this exactly: one docs-only commit pushed a
#      table past a byte cap and broke a guard, and the docs-only FIX for it
#      also ran no CI, so the fix's own green was never machine-confirmed.
#   2. The 7-bit-ASCII hard rule reaches .md as much as it reaches .py, and the
#      local commit-time gate only covers a clone that has run
#      `scripts/install_hooks.py`. A commit made from a fresh clone, or by an
#      automated routine that never installs hooks, is seen by CI or by nobody.
#
# So this workflow fires on exactly what ci.yml declines, and runs two things:
# the banned-glyph sweep over tracked .md, and the SUBSET of test modules that
# read tracked .md off disk. The minute saver survives in the shape that
# matters - a prose edit skips the compile sweep, ruff, mypy, the headless
# smoke and every test module that does not read a .md - but the guard subset
# is not small, and saying it was would be the kind of comment that reads as
# reassurance while describing something else. It is derived from the index on
# every run, so its size is whatever the tree currently justifies; the log
# prints the count.
#
# THE TWO SUITES ARE INVOKED SEPARATELY HERE, exactly as pytest.ini and
# CLAUDE.md require. Until 2026-09-06 the guard selection reached into
# agents/pity_engine/tests/ and handed both suites to ONE root-level pytest -
# the precise invocation pytest.ini names as how a sibling project earned its
# import-file-mismatch incident. It had been green on every docs push since it
# was written, which is why nothing surfaced it.
#
# Do not remove one file without the other, and keep the two filters
# complementary: an entry added to ci.yml's `paths-ignore` needs the matching
# entry in `paths` here, in the same commit.
#
# THE GUARD LIST IS NOT WRITTEN HERE. A hand-maintained universe in YAML is
# green over every module added after it was written. It is derived from
# `git ls-files` at CI time instead, so a guard added tomorrow is selected
# tomorrow.
#
# Paths are repo-root relative - see the header of ci.yml.

name: docs-guards

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      # Edits to the mechanism itself must re-run the mechanism.
      - '.github/workflows/docs-guards.yml'
      - 'tools/precommit_gate.py'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '.github/workflows/docs-guards.yml'
      - 'tools/precommit_gate.py'
  workflow_dispatch:

# A newer docs push supersedes an in-flight one, same shape as ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Read-only, and it stays that way. Sibling-C elevated its equivalent job
# to `contents: write` for an auto-repair-and-push step; that is a real answer
# to a real problem there, and it is not this tree's problem yet. Do not
# elevate this without a recorded reason.
permissions:
  contents: read

jobs:
  md-guards:
    name: guards that read docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          # The selection below shells out to `git ls-files`, which needs a
          # real index. A depth-1 clone provides one; being explicit that this
          # job is git-dependent.
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          # This job runs on the docs half of all commits, so it installs the
          # same small dev set the rest of the tree uses and nothing more. The
          # runtime is stdlib-only, so there is no second install to skip.
          pip install -r requirements-dev.txt

      - name: ASCII hygiene over tracked .md
        # Runs FIRST because it is seconds long and it is the check most likely
        # to fire on a prose edit. Reuses the very same banned-glyph engine the
        # git hooks use (tools/precommit_gate.py), so CI and the commit-time
        # gate can never disagree about what the rule means - two rules
        # enforcing one hard rule is how the looser one ends up deciding.
        #
        # Since 2026-09-06 they also share the SELECTION, not just the engine:
        # `--scan-tracked docs` and ci.yml's `--scan-tracked source` are the
        # two halves of one partition of the tracked set, defined once inside
        # the gate. They used to be two hand-written filters, and 14 tracked
        # files fell between them.
        #
        # The handoff carries no shell. It used to be
        # `xargs -r -a md_files.txt ... --scan-files`, and xargs splits on
        # WHITESPACE - a tracked path containing a space became two arguments
        # that both failed to open, and the gate reported "7-bit ASCII clean"
        # with EXIT 0 over a file carrying an em-dash.
        run: |
          set -euo pipefail
          # Counted in NUL terminators rather than lines, so a newline inside a
          # filename cannot inflate it, and derived from a different git call
          # than the gate's own - a cross-check, not the same number twice.
          expected="$(git ls-files -z -- '*.md' | tr -cd '\0' | wc -c)"
          echo "tracked .md files: ${expected}"
          python tools/precommit_gate.py --expect-count "${expected}" --scan-tracked docs

      - name: Select the guards that read tracked .md
        run: |
          set -euo pipefail
          # Derived, never hardcoded. Any test module that mentions a .md path
          # is a candidate; the set is recomputed on every run from the index.
          #
          # NUL-delimited throughout, matching the ASCII step above: `git
          # ls-files` without -z separates on newline and quotes unusual paths,
          # neither of which survives a filename carrying a space or a quote.
          #
          # SPLIT BY SUITE, and that is the point of this step rather than an
          # aside. pytest.ini and CLAUDE.md both say the two suites are run
          # SEPARATELY and never as one root-level collection; this job used to
          # select '*/tests/*.py' and 'tests/*.py' into ONE list and hand the
          # lot to a single pytest, which reached into agents/pity_engine/tests
          # and collected both suites together. It was green on every docs push,
          # which is exactly why it went unnoticed for as long as it did.
          #
          # THE INTERMEDIATES LIVE OUTSIDE THE WORKSPACE. This step used to
          # drop candidate_tests.txt and md_guards.txt into the repo root,
          # where anyone who ran these steps by hand would leave them for the
          # next `git add -A` to stage as junk. RUNNER_TEMP is provided by the
          # runner and is not the checkout; the fallback keeps a local hand-run
          # equally clean. Nothing in .gitignore has to know about this.
          WORK="${RUNNER_TEMP:-/tmp}/rc-docs-guards"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          git ls-files -z '*/tests/*.py' 'tests/*.py' > "$WORK/candidate_tests.z"
          : > "$WORK/app_guards.z"
          : > "$WORK/engine_guards.z"
          : > "$WORK/unbucketed.txt"
          while IFS= read -r -d '' f; do
            grep -qE '\.md([^a-zA-Z0-9]|$)' "$f" || continue
            case "$f" in
              agents/pity_engine/tests/*) printf '%s\0' "$f" >> "$WORK/engine_guards.z" ;;
              tests/*)                    printf '%s\0' "$f" >> "$WORK/app_guards.z" ;;
              # A candidate belonging to NEITHER suite is not dropped quietly.
              # A silent skip here would rebuild the same coverage hole one
              # directory over.
              *)                          printf '%s\n' "$f" >> "$WORK/unbucketed.txt" ;;
            esac
          done < "$WORK/candidate_tests.z"
          app_n="$(tr -cd '\0' < "$WORK/app_guards.z" | wc -c)"
          engine_n="$(tr -cd '\0' < "$WORK/engine_guards.z" | wc -c)"
          echo "md-reading guards: ${app_n} in tests/, ${engine_n} in agents/pity_engine/tests/"
          tr '\0' '\n' < "$WORK/app_guards.z"
          tr '\0' '\n' < "$WORK/engine_guards.z"
          if [ -s "$WORK/unbucketed.txt" ]; then
            echo "::error::these md-reading guards belong to neither suite, so neither invocation below would run them:"
            cat "$WORK/unbucketed.txt"
            exit 1
          fi

      - name: Run the md-reading guards - the two suites SEPARATELY
        run: |
          set -euo pipefail
          # Two invocations, never one. See pytest.ini: the engine package is
          # self-validating and is mirrored as a standalone unit, so collecting
          # it alongside tests/ is how a sibling project earned its
          # import-file-mismatch incident. Two steps' worth of output in one
          # step, so the log names which half failed.
          #
          # No -q. pytest.ini already carries `addopts = -q`; adding a second
          # one doubles it to -qq, which SUPPRESSES the summary line - the one
          # step in this job that runs assertions would log a wall of dots and
          # no count.
          #
          # -rs, and it is the other half of the same complaint. With no `-r`
          # spec a skip reaches the log as a bare `s` and nothing else, so
          # ran-and-found-nothing and not-present-at-all - two different
          # outcomes - become one indistinguishable character. .githooks/pre-push
          # and ci.yml both pass -rs to both of their invocations already; this
          # job was the last place in the tree that did not.
          #
          # ATTACHED TO THE FLAG on purpose. A detached `-r s` is correct
          # pytest, but a token scan cannot tell it from an `-r` followed by a
          # target, so tests/test_ci_workflow_complement.py reports that shape
          # UNPARSEABLE and FAILS rather than guessing. Keep the spec welded to
          # the flag and the guard can read it.
          #
          # Same path the selection step computed. RUNNER_TEMP is stable for
          # the whole job, so the two steps agree without leaving anything in
          # the checkout for a later `git add -A` to pick up.
          WORK="${RUNNER_TEMP:-/tmp}/rc-docs-guards"
          app=()
          engine=()
          mapfile -d '' -t app    < "$WORK/app_guards.z"
          mapfile -d '' -t engine < "$WORK/engine_guards.z"
          if [ "${#app[@]}" -eq 0 ] && [ "${#engine[@]}" -eq 0 ]; then
            # Legitimately possible while the tree is young. Say so loudly
            # rather than reporting a silent green over zero assertions.
            echo "::notice::no test module reads tracked .md yet - nothing to run"
            exit 0
          fi
          # The arrays are expanded directly. Never `xargs`, which splits on
          # whitespace and would turn one guard module whose path contains a
          # space into two nonexistent ones - and pytest handed a nonexistent
          # path is an error, while pytest handed NO path collects the whole
          # tree and reports a green this job did not earn.
          if [ "${#app[@]}" -gt 0 ]; then
            echo "--- application suite: ${#app[@]} md-reading module(s) ---"
            python -m pytest -rs --tb=short "${app[@]}"
          fi
          if [ "${#engine[@]}" -gt 0 ]; then
            echo "--- engine suite: ${#engine[@]} md-reading module(s) ---"
            python -m pytest -rs --tb=short "${engine[@]}"
          fi
