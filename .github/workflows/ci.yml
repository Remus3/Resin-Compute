# ResinCompute CI.
#
# PATHS ARE REPO-ROOT RELATIVE. This workflow is written as if `resin-compute/`
# IS the repository root, because that is what it becomes once this tree is
# extracted to its own repo. There is deliberately no `cd resin-compute` and no
# `working-directory:` anywhere below - if the tree is ever run from inside a
# parent repo instead, the fix is a single `defaults.run.working-directory`
# here, not a `cd` sprinkled through fifteen steps.
#
# THE DOCS PATH-SPLIT, and why this file has a sibling
# ----------------------------------------------------
# `paths-ignore: ['**/*.md']` below is a minute saver: a docs-only commit skips
# the whole suite, and in a repo where a large share of commits are the
# per-session notes sync that is most of the CI bill.
#
# It also opens a hole, and Sibling-C fell in it twice in a row. Test
# modules that READ tracked .md off disk and assert on its CONTENT go red on a
# docs-only commit - which triggers NO workflow at all, so nothing is watching.
# The docs-only FIX then also ran no CI, so its own green was never confirmed
# either.
#
# `.github/workflows/docs-guards.yml` is the complement: it fires on exactly
# what this file declines. Do not remove one without the other. If you add a
# `paths-ignore` entry here, add the matching `paths` entry there in the same
# commit.

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  # paths-ignore does not apply to a schedule, so the nightly run covers the
  # whole tree including anything a docs-only push skipped.
  #
  # NIGHTLY, GATED ON NEW COMMITS (MAIN 2246 ORDER s2, PERF-AUDIT item 3). The
  # `freshness` job below lets the schedule run the suite only when the
  # default branch gained a commit in the last 24 h. Gated rather than weekly
  # because push runs now deselect the `plumbing` marker when no plumbing root
  # changed, so the schedule is where a product edit that breaks a plumbing
  # test is caught - a week of latency there is too long, and a quiet day
  # costs one API call instead of a full run.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# Cancel a superseded in-progress run when a newer commit lands on the same
# ref, so rapid pushes do not each bill to completion. event_name is IN the
# group on purpose: without it a push would cancel the nightly schedule run, or
# the reverse. Only same-event runs supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege, declared at workflow level so any job added later inherits
# it. This workflow only reads the tree; nothing here needs write.
permissions:
  contents: read

jobs:
  freshness:
    # Schedule only. No checkout: one read of the commits API. Fails OPEN - any
    # error answers "fresh", so a broken probe costs a run and never skips one.
    name: nightly gate - any commit in the last 24 h
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      fresh: ${{ steps.decide.outputs.fresh }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          count="$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=${GITHUB_REF_NAME}&since=${since}&per_page=1" --jq 'length' 2>/dev/null)" || count=""
          if [ "${count}" = "0" ]; then fresh=false; else fresh=true; fi
          echo "commits since ${since}: '${count:-unknown}' -> fresh=${fresh}"
          echo "fresh=${fresh}" >> "$GITHUB_OUTPUT"

  check:
    name: lint, types, dual suite, headless smoke
    needs: freshness
    # `freshness` is SKIPPED for every non-schedule event, and a dependent of
    # a skipped job is skipped too unless its `if` opts out of that. So: not
    # cancelled, and either not the schedule or the schedule found a commit.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.freshness.outputs.fresh == 'true') }}
    runs-on: ubuntu-latest
    # The JOB ceiling must exceed every STEP ceiling below with room to spare.
    # A step killed by its own timeout is marked FAILED; a job killed by the
    # job ceiling is marked CANCELLED - the same word GitHub uses for a run
    # superseded by the concurrency group above, so a timed-out branch would
    # read as neither pass nor fail. Keep job > step or the conclusion goes
    # silent.
    timeout-minutes: 20

    steps:
      # Action majors match Sibling-C's, which is the tree these
      # workflows are ported from and the one where they are proven green.
      # SHA-pinned (MAIN ORDER 0300): a tag is mutable, a commit is not. The
      # trailing comment names the release tag the SHA was resolved from, and
      # Dependabot's github-actions entry bumps both together.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # FULL HISTORY, and it is now load-bearing. That guard the previous
          # comment here anticipated has arrived: tests/test_commit_trailers.py
          # sweeps `git log` over every commit and fails if one carries a
          # banned agent trailer - the `Co-Authored-By: Claude` ban CLAUDE.md
          # states as a hard rule and that .githooks/commit-msg enforces only
          # on a clone which ran scripts/install_hooks.py. A fork has not.
          #
          # On a depth-1 clone git answers "one commit" rather than erroring,
          # so that sweep would pass by construction. The module knows it and
          # SKIPS instead - honest, and it left CI enforcing NONE of the rule.
          # Two arms were skipping here for exactly this reason. Depth 0 is
          # what makes them run.
          #
          # THE COST, measured on the author's box 2026-09-09 so a future
          # reader can weigh a revert rather than guess: 113 commits, ~7 MB of
          # .git. That is noise beside the pip install below. If the history
          # ever grows enough to show in this step's timing, move the sweep
          # somewhere it still runs - do not drop this back to 1 and leave two
          # arms skipping green.
          #
          # FULL HISTORY ON THE SCHEDULE ONLY, SINCE MAIN 2246 ORDER s2
          # (PERF-AUDIT item 10). The sweep reads the WHOLE history on the
          # nightly schedule and on a manual dispatch, at depth 0. A push or
          # pull-request job fetches the last 100 commits and runs the sweep
          # over ONLY the range that event brought (`RSC_TRAILER_RANGE`, set by
          # the trailer step below) - and that sweep FAILS, never skips, if the
          # range base was not fetched, so a push of more than 100 commits
          # reds here and the fix is a deeper fetch, not a skip.
          #
          # tests/test_ci_history_depth.py goes red if the schedule stops
          # fetching full history while that sweep still ships, or if the
          # range step goes away.
          #
          # docs-guards.yml stays at depth 1 on purpose: it runs `git
          # ls-files` and the `reads_docs` modules, and reads no history.
          fetch-depth: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '0' || '100' }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # 3.11 is the pin. ruff.toml targets py311 and mypy.ini declares
          # python_version 3.11; running CI on anything else would validate a
          # language level the tree does not claim.
          python-version: '3.11'
          cache: pip
          # Both files, so a change to either busts the cache. The default
          # (**/requirements.txt) would miss the dev pins entirely, which is
          # the file that actually decides what gets installed here.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev deps
        # HASH-PINNED (MAIN ORDER 0300). requirements-dev.txt is pip-compile
        # output from requirements-dev.in: the full closure with a sha256 for
        # every distribution. --require-hashes makes pip refuse anything
        # unhashed or mismatched. Dependabot regenerates the pair together. No
        # `pip install --upgrade pip`: that line could not carry a hash, and
        # the runner's bundled pip is sufficient.
        #
        # requirements.txt is deliberately EMPTY - the runtime is stdlib-only
        # (see that file). Installing it anyway, also under --require-hashes, is
        # the cheap way to notice the day that stops being true: a pin added
        # there without a hash fails this step.
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: ruff lint
        run: ruff check .

      - name: py_compile sweep over every .py
        # Not redundant with ruff. Ruff parses with its own Rust frontend; this
        # asserts that the pinned CPython can compile every file in the tree,
        # which is the property that matters at runtime - a syntax error under
        # a windowless interpreter is a SILENT crash, so it must never reach a
        # branch.
        run: |
          set -euo pipefail
          count="$(find . -name '*.py' -not -path './.venv/*' \
                        -not -path '*/__pycache__/*' | wc -l)"
          python -m compileall -q -x '(\.venv|__pycache__|build|dist)' .
          echo "py_compile sweep OK over ${count} .py file(s)"

      - name: ASCII hygiene over every tracked non-markdown file
        # THE HOOK CANNOT BE THE ONLY ENFORCEMENT OF THIS RULE, and once this
        # repository is public the hook is STRUCTURALLY ABSENT for the whole
        # population the rule exists to catch.
        #
        # CLAUDE.md states the banned-glyph rule as a hard rule and
        # .githooks/pre-commit enforces it at commit time. It also states, in
        # the same breath, that `core.hooksPath` is LOCAL CONFIG AND IS NOT
        # CLONED - so a fresh clone runs zero hooks until someone runs
        # scripts/install_hooks.py. A fork opening a pull request has never run
        # it. For that contributor CI is not a backstop, it is the ONLY gate.
        #
        # docs-guards.yml covers tracked .md and is skipped here because ci.yml
        # never runs on a docs-only push. This step covers EVERYTHING ELSE.
        #
        # SELECTION IS HALF THE RULE, and it used to be the unshared half.
        # Both steps shared the engine (tools/precommit_gate.py) and each wrote
        # its own SELECTION: an extension allowlist here, '*.md' there. On
        # 2026-09-06 that allowlist missed 14 tracked files - every .githooks/
        # script, LICENSE, NOTICE, both requirements files, .gitattributes,
        # .gitignore, the supervisor XML and ops/install_scheduled_task.ps1,
        # which carries its OWN 17-line ASCII-ONLY header citing the PowerShell
        # 5.1 parse failure that is the reason the rule exists at all. The
        # comment above this step claimed it "covers everything else"; it did
        # not, and nothing said so.
        #
        # `--scan-tracked source` now defines source as THE COMPLEMENT OF .md
        # inside the gate itself, so the two halves partition the tracked set
        # by construction and cannot develop a hole between them. The staged
        # hook already scans every staged file regardless of extension, so this
        # also stops CI from being the looser of the two readings.
        #
        # AND THE HANDOFF IS NUL-SAFE. This step used to end in
        # `xargs -r -a src_files.txt ... --scan-files`. xargs splits on
        # WHITESPACE: a tracked path containing a space became two arguments
        # that both failed to open, the gate warned on stderr, continued, and
        # printed "7-bit ASCII clean" with EXIT 0 over a file carrying an
        # em-dash. README.md advertises a space-containing install path as a
        # deliberately exercised case and .githooks/* were hardened to quote
        # every expansion - these two CI steps were the pair that had not been.
        # A single quote in a name failed the other way: `xargs: unmatched
        # single quote`, red on a legal filename. There is no shell in the
        # handoff any more, so neither is reachable.
        run: |
          set -euo pipefail
          # The expected count is derived HERE, by counting NUL terminators in
          # a DIFFERENT git invocation than the one the gate makes. It is a
          # cross-check, not the same number quoted twice, and it is counted in
          # NULs rather than lines so a newline inside a filename cannot inflate
          # it. If the two disagree the step goes red rather than sweeping a
          # short list quietly.
          total="$(git ls-files -z | tr -cd '\0' | wc -c)"
          docs="$(git ls-files -z -- '*.md' | tr -cd '\0' | wc -c)"
          expected="$(( total - docs ))"
          echo "tracked: ${total} | .md (docs-guards.yml's half): ${docs} | this step's half: ${expected}"
          if [ "${expected}" -le 0 ]; then
            echo "::error::the sweep would select NOTHING - it would pass vacuously"
            exit 1
          fi
          python tools/precommit_gate.py --expect-count "${expected}" --scan-tracked source

      - name: git hook gate armed and firing
        # THE STEP ABOVE PROVES THE RULE IS ENFORCED IN CI. THIS ONE PROVES THE
        # COMMIT-TIME HALF IS ENFORCED AT ALL.
        #
        # `.githooks/` being tracked is not evidence. CLAUDE.md says it in as
        # many words: never treat a hook's PRESENCE as proof it fires. A hook
        # that is present, tracked, and never invoked looks identical to a
        # working one from anywhere except a real commit - so this step runs
        # tests/test_hook_gate.py, which stands up a throwaway `git init` under
        # the runner's temp dir, stages a banned glyph, attempts a REAL commit,
        # and asserts HEAD IS UNCHANGED. It carries a POSITIVE CONTROL for the
        # same reason: a gate that refuses everything passes both refusal arms,
        # and that is the catastrophically broken version.
        #
        # ARM IT FIRST. `core.hooksPath` is LOCAL config and is NOT cloned, so
        # this runner starts with zero hooks - exactly like the fork that has
        # never run the installer.
        #
        # BE PRECISE ABOUT WHAT THIS LINE BUYS, because the first version of
        # this comment claimed more than it delivers and an adversarial pass
        # measured it on 2026-09-06. `tests/test_hook_gate.py` builds and arms
        # its OWN throwaway repository in `tmp_path`; it never consults this
        # checkout's `core.hooksPath`. Unsetting `core.hooksPath` here and
        # re-running the module gives 12 passed, exit 0. So the installer is
        # NOT what makes the probe below meaningful, and an unconfigured clone
        # is not a SKIP that the flag converts - it is a full pass.
        #
        # What arming actually buys is (a) this repository's own commit-time
        # gate being live for anything later in the job, and (b) the installer
        # itself failing loudly if the tracked hooks are unusable. Both worth
        # having. Neither is the probe.
        #
        # RSC_REQUIRE_HOOK_GATE=1 IS THE LOAD-BEARING PART, and what it
        # converts is AN UNMEASURABLE MACHINE - not an unconfigured clone.
        # Without it, a runner that cannot reach a POSIX `sh`, cannot reach
        # git, or cannot find `.githooks/pre-commit` to copy SKIPS, and A
        # SKIPPED TEST IS A GREEN TICK. That is how a sibling repo's five hooks
        # sat at mode 100644 for weeks with green CI while a headless run
        # committed a banned glyph straight through the hole.
        #
        # Verified in both directions on 2026-09-06 by hiding
        # `.githooks/pre-commit`: without the flag, 6 skipped with the reason
        # naming the flag; with it, 6 errors and exit 1. The flag path raises
        # inside a fixture, so pytest reports ERRORS rather than failures -
        # non-zero either way, but worth knowing before reading a red log.
        #
        # THE HOOK SET IS ASSERTED BY NAME, NOT BY COUNT. Sibling-C's
        # version of this step asserts `-ge 5`, which is that sibling's number; copying
        # it here would be red on arrival, and a bare count drifts silently in
        # both directions anyway. The name check runs FIRST and is also the
        # anti-vacuity arm for the mode check below - an empty listing fails
        # the comparison rather than passing the `awk` filter with nothing in
        # it.
        run: |
          set -euo pipefail
          python scripts/install_hooks.py

          expected='.githooks/commit-msg .githooks/pre-commit .githooks/pre-push'
          actual="$(git ls-files .githooks/ | sort | tr '\n' ' ')"
          actual="${actual% }"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::tracked hooks are [${actual}], expected [${expected}]"
            exit 1
          fi

          # 100644 is the difference between a gate and nothing on Linux, and
          # git REPORTS NOTHING when it declines to run a non-executable hook -
          # the commit simply succeeds. awk rather than grep -v so the filter
          # matching nothing is not itself a non-zero exit under pipefail.
          bad="$(git ls-files -s .githooks/ | awk '$1 != "100755" { print $1 " " $NF }')"
          if [ -n "${bad}" ]; then
            echo "::error::a tracked hook is not mode 100755: ${bad}"
            exit 1
          fi
          echo "armed: ${actual} (all mode 100755)"

          # -rs SO THIS STEP'S SKIPS ARE NAMED, and be precise about what that
          # buys here rather than claiming more. RSC_REQUIRE_HOOK_GATE=1
          # already converts the unmeasurable-machine skips into ERRORS, so
          # for those this flag is defence in depth and not the load-bearing
          # part. What it does cover is every skip the flag does NOT govern:
          # an arm that opts out for its own reason still renders as a bare
          # `s` at exit 0, which is a green tick over a gate nobody exercised.
          RSC_REQUIRE_HOOK_GATE=1 python -m pytest -rs tests/test_hook_gate.py

      - name: mypy
        # ADVISORY, deliberately, and this is the one line to change when that
        # should stop being true.
        #
        # SCHEDULE AND DISPATCH ONLY until it is blocking (MAIN 2246 ORDER s2,
        # PERF-AUDIT item 10): an advisory result nobody reads was costing a
        # step on every push. Drop this `if` in the same commit that drops
        # `continue-on-error`.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        #
        # docs/SPEC_SCAFFOLD.md section 7 defines slice acceptance as
        # py_compile + ruff + the slice's own pytest + no banned glyph. mypy is
        # NOT in it. Making it blocking here would impose a requirement on
        # every other slice that its written contract does not carry, and a
        # scaffold whose first CI run is red for an unagreed reason teaches
        # people to ignore the red. Flip `continue-on-error` to false (or drop
        # the line) once the tree settles and section 7 is amended to match.
        continue-on-error: true
        run: mypy

      # THE TWO SUITES RUN SEPARATELY, and never as `pytest .` from the root.
      # pytest.ini says why: the engine package is self-validating and is
      # mirrored as a standalone unit, so a root-wide collection is how a
      # sibling project earned its import-file-mismatch incident. Two steps
      # rather than one command with two arguments, so the summary names which
      # half failed.
      #
      # AND BOTH ASK PYTEST TO NAME THEIR SKIPS. Measured on run 34343895319
      # (ubuntu-latest, Python 3.11.16): `1 failed, 1636 passed, 19 skipped in
      # 24.30s`, and NOT ONE of the nineteen was named. The same tree on the
      # author's Windows box reports 1 skip, so eighteen arms silently do not
      # run on the machine that actually decides red, and the log says nothing
      # about which ones or why.
      #
      # A SKIP THAT NAMES NO REASON IS INDISTINGUISHABLE FROM A TEST THAT WAS
      # NEVER WRITTEN. This tree already holds the three-disposition doctrine:
      # ran-and-found-nothing, ran-and-broke, and not-present-at-all. The first
      # and the third are BOTH skips, separated only by their reason text, so a
      # reason-less skip collapses two dispositions into one unreadable `s`.
      # tests/test_hook_gate.py records the sharpest instance in its own
      # docstring - with RSC_REQUIRE_HOOK_GATE unset and a genuine absence, six
      # of its arms skip, the run exits 0, and the six reasons, each of which
      # NAMES the flag, are never printed. That docstring ends "Closing that
      # means changing CI, which is outside this file." This is that change.
      #
      # WHY -rs AND NOT A SECOND -q OR A -v. pytest.ini already carries
      # `addopts = -q`, which suppresses the per-test skip LINES but not the
      # `-r` short summary, so the two compose. A second -q would double to
      # -qq and suppress the summary COUNT as well, which is the opposite of
      # this fix and is separately guarded in
      # tests/test_ci_workflow_complement.py. -v would re-expand every one of
      # the 1600-odd passing lines to buy the same nineteen reasons.
      #
      # THE FLAG IS GRADED BY ITS SPEC, NOT BY ITS SPELLING. `-rA` and `-r s`
      # report strictly more and are correct here; an earlier guard in this
      # tree keyed on the literal string `-rs` and went RED on both, on a line
      # continuation, and on a reordering - four false reds on correct code.
      # The guard reads the `-r` SPEC and asks whether its characters report
      # skips, and it FAILS rather than guesses on a shape it cannot read.
      #
      # PLUMBING RUNS WHEN PLUMBING CHANGES (MAIN 2246 ORDER s2, PERF-AUDIT
      # item 2). Most application items test fleet, responder, hook and CI
      # plumbing. On a push or pull request whose diff touches no plumbing
      # root (tools/, headless/, scripts/, ops/, .githooks/, .github/,
      # .claude/) and no FULL trigger, the application suite runs
      # `-m "not plumbing"`; the marker is applied from tests/_markers.py.
      # The schedule and a dispatch always run every module, and any failure
      # to compute the diff runs every module too.
      #
      # TIMINGS (item 4): both suites print their 25 slowest phases and copy
      # that block into the job summary, so a slow arm is visible without
      # downloading a log.
      - name: Decide whether plumbing modules run
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            base="${BEFORE}"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE}"
          fi
          mark="$(python scripts/prepush_select.py --ci-mark ${base:+--base "$base"})"
          echo "application suite marker expression: '${mark:-none - every module runs}'"
          echo "mark=${mark}" >> "$GITHUB_OUTPUT"

      - name: Application suite (tests/)
        timeout-minutes: 10
        env:
          RSC_MARK: ${{ steps.scope.outputs.mark }}
        run: |
          set +e
          python -m pytest -rs tests -m "${RSC_MARK}" --durations=25 > "${RUNNER_TEMP}/app-suite.log"
          status=$?
          set -e
          cat "${RUNNER_TEMP}/app-suite.log"
          {
            echo "### Application suite - 25 slowest (marker: '${RSC_MARK:-all}')"
            echo '```'
            sed -n '/slowest 25 durations/,/^=/p' "${RUNNER_TEMP}/app-suite.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Engine suite (agents/pity_engine)
        timeout-minutes: 10
        run: |
          set +e
          python -m pytest -rs agents/pity_engine --durations=25 > "${RUNNER_TEMP}/engine-suite.log"
          status=$?
          set -e
          cat "${RUNNER_TEMP}/engine-suite.log"
          {
            echo "### Engine suite - 25 slowest"
            echo '```'
            sed -n '/slowest 25 durations/,/^=/p' "${RUNNER_TEMP}/engine-suite.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Agent-trailer sweep over the range this event brought
        # The push-job half of tests/test_commit_trailers.py's history sweep
        # (PERF-AUDIT item 10). It runs here unconditionally because that
        # module is `plumbing` and the application step above may have
        # deselected it. An all-zero `before` (a new branch) leaves no range,
        # and the module's shallow-clone skip then applies, named by -rs.
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            base="${BEFORE}"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE}"
          fi
          case "${base}" in
            *[!0]*) export RSC_TRAILER_RANGE="${base}..HEAD" ;;
          esac
          echo "trailer sweep range: ${RSC_TRAILER_RANGE:-none}"
          python -m pytest -rs tests/test_commit_trailers.py

      - name: Headless lane smoke test
        timeout-minutes: 5
        # The lane has to START on this runner, on a bare interpreter with no
        # runtime dependencies installed. A green unit suite does not prove
        # that: the suites import modules, while the lane is entered through
        # `python -m`, which exercises __main__ dispatch, argument parsing and
        # the whole import graph in one shot.
        #
        # --dry-run so nothing is fetched and nothing is written; --once so it
        # performs a single pass instead of entering its scheduler loop.
        #
        # The exit code is checked EXPLICITLY rather than left to the shell's
        # errexit, so the log carries the observed status either way.
        run: |
          set +e
          python -m headless.runner --once --dry-run
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::headless lane smoke exited ${status}, expected 0"
            exit 1
          fi
          echo "headless lane smoke: exit 0"
