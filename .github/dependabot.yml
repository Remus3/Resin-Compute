# Dependabot version updates (MAIN ORDER 0300, 2026-10-05).
#
# One entry per ecosystem actually present, weekly, one group each so a week is
# at most one PR per ecosystem rather than a burst. PRs are merged by this tree
# once its gating CI is green on them; nothing here auto-merges.
#
# - github-actions keeps the SHA pins in .github/workflows/ and their trailing
#   `# vX.Y.Z` comments current together.
# - pip at the root covers requirements.txt (deliberately empty) and the
#   pip-compile pair requirements-dev.in (human pins) / requirements-dev.txt
#   (compiled, hashed). Dependabot detects the pair from the .txt header
#   "autogenerated by pip-compile", bumps the pin in the .in and re-runs
#   pip-compile with --generate-hashes because the .txt carries hashes, so
#   one PR moves pins and hashes together. tests/test_supply_chain.py reds if
#   they ever drift.
# - npm at /shell covers the Electron companion's package.json and lockfile.
#
# tests/test_supply_chain.py pins the three entries, the weekly interval and the
# groups block.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip-dev:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /shell
    schedule:
      interval: weekly
    groups:
      npm-shell:
        patterns: ['*']
